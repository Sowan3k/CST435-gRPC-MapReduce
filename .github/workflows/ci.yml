name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -v

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose build
      - name: Run the stack offline with the mock backend
        env:
          TRANSLATOR: mock
          LOCAL_UID: "0"
          LOCAL_GID: "0"
        run: docker compose up --abort-on-container-exit --exit-code-from coordinator
      - name: Check the output file on the host
        run: |
          test -s data/output_malay.txt
          # input.txt has six paragraphs; the mock prefixes each line with "[ms] "
          test "$(grep -c '^\[ms\] ' data/output_malay.txt)" -eq 6
      - name: Stop the stack
        if: always()
        run: docker compose down
